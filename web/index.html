<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MEDMATE - Smart Medicine Management">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MEDMATE">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>MEDMATE</title>
  <link rel="manifest" href="manifest.json">

  <!-- Poppins from Google Fonts for web -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #F8FAFC;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #2563EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .logo-box {
      width: 88px; height: 88px;
      background: white;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .logo-box span { font-size: 44px; }
    #loading h1 {
      color: white; font-size: 32px; font-weight: 700;
      letter-spacing: 3px; font-family: 'Poppins', sans-serif;
    }
    #loading p {
      color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 6px;
      font-family: 'Poppins', sans-serif;
    }
    .spinner {
      margin-top: 40px;
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Splash screen shown until Flutter is ready -->
  <div id="loading">
    <div class="logo-box"><span>💊</span></div>
    <h1>MEDMATE</h1>
    <p>Your Smart Medicine Companion</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function() { loader.remove(); }, 500);
      }
    });
  </script>
</body>
</html>
